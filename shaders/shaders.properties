# Firebroxn - Minecraft Shaderpack
# Author: Firebroxn Team
# Version: 1.0.0
# For: OptiFine HD U I5+ / Iris 1.6+ / MC 1.16.5 - 1.21.x
# Profile: Warm Cinematic - Volumetric light, soft shadows, reflective water

# ========== Shadow Settings ==========
shadowMapResolution=2048
shadowDistance=180.0
shadowDistanceRenderMul=1.0
shadowIntervalSize=4.0
generateShadowMipmap=true
generateShadowColorMipmap=true
shadowHardwareFiltering=true
shadowHardwareFiltering0=true
shadowHardwareFiltering1=true
shadowCulling=true
entityShadow=true

# Noise for dithering / TAA
noiseTextureResolution=256

# ========== Buffers ==========
# colortex0 = Main HDR color
# colortex1 = Normals + useful data (not fully used in this version, reserved)
# colortex2 = Bloom / extra light
# colortex3 = Volumetric light mask
screen=composite composite1 composite2 final

# Internal formats - keep HDR where needed
format.colortex0=R11F_G11F_B10F
format.colortex1=RGBA8
format.colortex2=RGBA8
format.colortex3=RGBA8

# Filtering - linear for color, nearest for depth
texture.min.filter.colortex0=linear
texture.mag.filter.colortex0=linear
texture.min.filter.colortex1=nearest
texture.mag.filter.colortex1=nearest
texture.min.filter.shadowtex0=linear
texture.mag.filter.shadowtex0=linear
texture.min.filter.shadowtex1=linear
texture.mag.filter.shadowtex1=linear
texture.min.filter.shadowcolor0=linear
texture.mag.filter.shadowcolor0=linear

# ========== Options Screen ==========
# Users can tweak via OptiFine/Iris shader options UI
screen.columns=2
[option.SHADOWS]
  name=Soft Shadows
  define=SHADOWS_ENABLED
  value=true

[option.GODRAYS]
  name=Volumetric God Rays
  define=GODRAYS_ENABLED
  value=true

[option.WAVING]
  name=Waving Foliage & Water
  define=WAVING_ENABLED
  value=true

[option.REFLECTIONS]
  name=Water Reflections
  define=REFLECTIONS_ENABLED
  value=true

[option.BLOOM]
  name=Bloom Glow
  define=BLOOM_ENABLED
  value=true

# ========== Old/Compatibility ==========
# Disable vanilla clouds - we render our own volumetric clouds in sky
clouds=false

# ========== World Dimensions ==========
# Nether & End get slightly different fog
world-1.shadowMapResolution=1024
world1.shadowMapResolution=1024

# ========== Program Definitions ==========
# Gbuffers - terrain, water, sky, entities
program.gbuffers_terrain.sunAngle=world0
program.gbuffers_water.sunAngle=world0
program.shadow.sunAngle=world0

# Shadow pass
program.shadow.ids=shadow

# Composite passes draw fullscreen quads
program.composite.ids=composite
program.composite1.ids=composite1
program.composite2.ids=composite2

# Final tonemaps to screen
program.final.ids=final

# Screen drawing helpers
# Don't clear buffers between composite passes (for bloom accumulation)
clearColortex0=false
